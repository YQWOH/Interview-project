services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panorama-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SERVICE_NAME=Panorama AI Detection Service
      - VERSION=1.0.0
      - DEBUG=True
      - HOST=0.0.0.0
      - PORT=8000
      - MODEL_NAME=yolov5s
      - CONFIDENCE_THRESHOLD=0.5
      - MAX_DETECTIONS=10
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5000
      - MAX_FILE_SIZE=10485760
      - ALLOWED_EXTENSIONS=jpg,jpeg,png,webp
      - BACKEND_API_URL=http://panorama-backend:5000
    networks:
      - panorama-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  panorama-network:
    external: true
    name: backend_panorama-network
